name: Publish YI Java package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish
        required: true
        default: 3.8.3-yi.1
        type: string
  push:
    tags:
      - java-v*

permissions:
  contents: read
  packages: write

jobs:
  native:
    name: Build native library (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            library: libhtml_to_markdown_ffi.so
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            library: libhtml_to_markdown_ffi.so
          - os: windows-latest
            platform: windows-x86_64
            library: html_to_markdown_ffi.dll

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build FFI library
        run: cargo build --release --package html-to-markdown-ffi

      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.platform }}"
          cp "target/release/${{ matrix.library }}" "dist/${{ matrix.platform }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    name: Assemble and publish Java package
    needs: native
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: native-artifacts

      - name: Resolve package version
        shell: bash
        run: |
          if [[ -z "$PACKAGE_VERSION" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#java-v}"
          fi
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Stage natives into Java resources
        shell: bash
        run: |
          rm -rf packages/java/src/main/resources/natives
          mkdir -p packages/java/src/main/resources/natives/linux-x86_64
          mkdir -p packages/java/src/main/resources/natives/linux-aarch64
          mkdir -p packages/java/src/main/resources/natives/windows-x86_64
          cp native-artifacts/java-native-linux-x86_64/libhtml_to_markdown_ffi.so \
            packages/java/src/main/resources/natives/linux-x86_64/
          cp native-artifacts/java-native-linux-aarch64/libhtml_to_markdown_ffi.so \
            packages/java/src/main/resources/natives/linux-aarch64/
          cp native-artifacts/java-native-windows-x86_64/html_to_markdown_ffi.dll \
            packages/java/src/main/resources/natives/windows-x86_64/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Java package
        shell: bash
        run: |
          mvn -f packages/java/pom.xml versions:set \
            -DnewVersion="$PACKAGE_VERSION" -DgenerateBackupPoms=false
          mvn -f packages/java/pom.xml package -DskipTests \
            -Dclassifier=yi-package -Dcheckstyle.skip=true -Dpmd.skip=true -Dcpd.skip=true
          jar tf "packages/java/target/html-to-markdown-${PACKAGE_VERSION}-yi-package.jar" > jar-contents.txt
          grep -Fx 'natives/linux-x86_64/libhtml_to_markdown_ffi.so' jar-contents.txt
          grep -Fx 'natives/linux-aarch64/libhtml_to_markdown_ffi.so' jar-contents.txt
          grep -Fx 'natives/windows-x86_64/html_to_markdown_ffi.dll' jar-contents.txt

      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn deploy:deploy-file \
            -Dfile="packages/java/target/html-to-markdown-${PACKAGE_VERSION}-yi-package.jar" \
            -DpomFile=packages/java/pom.xml \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/YIProcesses/html-to-markdown \
            -DretryFailedDeploymentCount=3

      - uses: actions/upload-artifact@v4
        with:
          name: html-to-markdown-${{ env.PACKAGE_VERSION }}
          path: packages/java/target/html-to-markdown-${{ env.PACKAGE_VERSION }}-yi-package.jar
          if-no-files-found: error
